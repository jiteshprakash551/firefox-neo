name: verify-neo-arm64
on:
  workflow_dispatch:
    inputs:
      finalize_run_id:
        description: finalize-neo run id (signed arm64 APK)
        required: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: neo-final
          path: final
          run-id: ${{ inputs.finalize_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules; sudo udevadm trigger --name-match=kvm
      - name: arm64 APK on x86_64 emulator with ARM translation (API 30)
        uses: reactivecircus/android-emulator-runner@v2
        env:
          APK_OVERRIDE: final/NeoBrowser-arm64.apk
          SLOW_WAIT: "60"
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash ${{ github.workspace }}/neo/smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: neo-smoke-arm64
          path: smoke-out/
          retention-days: 3
