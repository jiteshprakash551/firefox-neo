name: finalize-neo
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: build-neo run id
        required: true
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: neo-out-aarch64
          path: in
          run-id: ${{ inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Align, sign, verify
        env:
          KSB64: ${{ secrets.NEO_KS_B64 }}
          KSPW: ${{ secrets.NEO_KS_PW }}
        run: |
          set -e
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1); echo "build-tools $BT"
          mkdir -p final; echo "$KSB64" | base64 -d > /tmp/neo.p12
          IN=in/app-arm64-v8a-release.apk
          $BT/zipalign -p -f 4 $IN final/neo-unsigned-aligned.apk
          $BT/apksigner sign --ks /tmp/neo.p12 --ks-key-alias neo --ks-pass env:KSPW --key-pass env:KSPW --out final/NeoBrowser-arm64.apk final/neo-unsigned-aligned.apk
          rm -f /tmp/neo.p12 final/neo-unsigned-aligned.apk final/*.idsig
          { echo "== apksigner verify"; $BT/apksigner verify --verbose --print-certs final/NeoBrowser-arm64.apk; echo "== zipalign check"; $BT/zipalign -c -P 16 4 final/NeoBrowser-arm64.apk && echo aligned-ok;
            echo "== badging"; $BT/aapt2 dump badging final/NeoBrowser-arm64.apk | grep -E "^package|sdkVersion|targetSdk|application-label:|launchable|native-code";
            echo "== permissions"; $BT/aapt2 dump permissions final/NeoBrowser-arm64.apk;
            echo "== sha256"; sha256sum final/NeoBrowser-arm64.apk; ls -l final/NeoBrowser-arm64.apk; cat in/ff-rev.txt; } | tee final/report.txt
      - uses: actions/upload-artifact@v4
        with:
          name: neo-final
          path: final/
          retention-days: 7
